[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "malecns-ol-analysis"
version = "0.1.0"

description = "Analysis of male CNS connectome focusing on vision"
authors = [{name = "Judith Hoeller", email = "hoellerj@janelia.hhmi.org"}]
keywords = ["connectomics", "neural network", "vision", "Drosophila", "neuroscience"]
readme = "README.md"
license = {file="LICENSE"}

dependencies = [
    "connectome-interpreter @ git+https://github.com/YijieYin/connectome_interpreter.git@main",
    "numpy>=2,<2.3",    # <2.3 keeps Python-3.10 installability (numpy 2.3 needs 3.11+) and holds scipy/ABI at the tested set
    "pandas<3",
    "scipy<1.14",
    "tqdm",
    "plotly",
    "matplotlib<3.11",
    "networkx",
    "ipywidgets",
    "jupytext",
    "openpyxl",
    "pyarrow>=16", 
    "kaleido>=1.0", 
    "igraph",
    "scikit-learn",
    "pypdf",
    "reportlab",
    "neuprint-python @ git+https://github.com/artxz/neuprint-python.git@51cb61b2699e9d381bccde0d3eeb4c709087f5fd",
    "python-dotenv",
    "alphashape",
    "cmap",
    "colormath",
    # Pinned to a commit SHA (was @master) for reproducibility — matches the working
    # env / requirements-lock.txt. Bump deliberately.
    "navis @ git+https://github.com/artxz/navis.git@93de9aff5ca913407f9d85983a9f4e3c6a8c5dd5",
    "pyvis",
    "requests",
    "shapely",
    "fafbseg",
    "pymupdf",
    "cloud-volume",
]

[project.optional-dependencies]
wandb = ["wandb"]
# "prop" is only used by a private, untracked script (not in src/); keep optional.
prop_package = ["prop"]

[tool.setuptools]
py-modules = []

[tool.mypy]
mypy_path = "src"
install_types = true
ignore_missing_imports = true
follow_untyped_imports = false
pretty = true
show_error_context = true
show_column_numbers = true
show_error_code_links = true

[tool.ruff]
# Minimal, permissive lint config (Phase C4). Formatting/style rules are
# intentionally NOT enabled yet; this first CI pass only catches real breakage.
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
# The classic "real errors only" subset: syntax errors (E9), invalid
# comparisons/asserts (F63), statement errors (F7), and undefined names (F82).
# Green across all of src/ today, the jupytext notebook `.py` pairs included.
# When broadening this later (e.g. add "F" for unused imports, or "E"/"W" style
# rules) the notebook pairs will get noisy — add them to `extend-exclude` then.
select = ["E9", "F63", "F7", "F82"]
